name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/teclado-ia-v0.1.0-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teclado-ia-debug-apk
          path: out/teclado-ia-v0.1.0-debug.apk

      - name: Publish GitHub Release v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Teclado IA v0.1.0 (MVP)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Teclado IA v0.1.0 — MVP gratuito.
            - Ditado por voz em tempo real (online: reconhecimento do Android; offline: Vosk)
            - Correção de palavras em português (offline: SymSpell + dicionário 50k; online: LanguageTool)
            APK de depuração (debug). Instale permitindo "fontes desconhecidas".
          files: out/teclado-ia-v0.1.0-debug.apk
          fail_on_unmatched_files: true
